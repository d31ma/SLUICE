name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes gcc libgl1-mesa-dev xorg-dev
      - name: Test with the race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes gcc libgl1-mesa-dev xorg-dev
      - name: Formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: CRAP score ceiling
        run: make crap
      - name: Vulnerability scan
        run: make vuln
      - name: License policy
        run: make licenses
      - name: Documentation and contracts
        run: make docs
