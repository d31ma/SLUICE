name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes gcc
          libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev
          libxkbcommon-dev libxkbcommon-x11-dev wayland-protocols xorg-dev
      - name: Test with the race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes gcc
          libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev
          libxkbcommon-dev libxkbcommon-x11-dev wayland-protocols xorg-dev
      - name: Formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: CRAP score ceiling
        run: make crap
      - name: Vulnerability scan
        run: make vuln
      - name: License policy
        run: make licenses
      - name: Documentation and contracts
        run: make docs
