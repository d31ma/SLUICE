name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes gcc
          libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev
          libxkbcommon-dev libxkbcommon-x11-dev wayland-protocols xorg-dev
      - name: Test with the race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes gcc
          libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev
          libxkbcommon-dev libxkbcommon-x11-dev wayland-protocols xorg-dev
      - name: Formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: CRAP score ceiling
        run: make crap
      - name: Vulnerability scan
        run: make vuln
      - name: License policy
        run: make licenses
      - name: Documentation and contracts
        run: make docs

  installed-runtime:
    name: Installed runtimes ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      SLUICE_REQUIRE_INSTALLED_RUNTIMES: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install pinned Linux amd64 runtimes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/sluice-runtime"
          mkdir -p "$runtime_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$runtime_dir/ty" \
            https://github.com/d31ma/Tachyon/releases/download/v26.33.02/ty-linux-x64
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$runtime_dir/fylo" \
            https://github.com/d31ma/FYLO/releases/download/v26.33.02/fylo-linux-x64
          printf '%s  %s\n' \
            c662da31be584364b1d0554df232336a047b90ba66ab9bde9c87e248bb184616 "$runtime_dir/ty" \
            8d60479cc189afb991d969917158d93d78897dcd0ca3aa7e062be186982644e8 "$runtime_dir/fylo" \
            | sha256sum --check
          chmod 0755 "$runtime_dir/ty" "$runtime_dir/fylo"
          echo "$runtime_dir" >> "$GITHUB_PATH"
      - name: Stage native Windows amd64 portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Join-Path $env:RUNNER_TEMP 'sluice-windows-package'
          & ./scripts/stage-app-bundle-windows.ps1 -StageRoot $stageRoot
          "SLUICE_WINDOWS_STAGE=$stageRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runtimeDir = Join-Path $stageRoot 'Sluice/runtime/bin'
          $runtimeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Record native runner
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
      - name: Run installed-runtime and production IPC contracts
        run: >-
          go test -race -count=1
          ./internal/runtime ./internal/state/fylo ./internal/transport/ipc
          ./internal/agent ./internal/transport/localapi ./internal/transport/yon
          ./cmd/sluice-agent
      - name: Exercise native Windows package topology twice
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-app-bundle-windows.ps1
          -StagedRoot $env:SLUICE_WINDOWS_STAGE
