name: Feature request
description: Propose a user outcome or interoperability improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem independently of a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Data-safety, compatibility, or platform constraints
